# Yelp ML + Cassandra + PySpark dev container (project mounted at /app)
#
# Usage:
#   docker compose up -d --build
#   docker compose exec spark python /app/scripts/setup_cassandra.py
#   docker compose exec spark python /app/prepare_data.py
#   docker compose exec spark python /app/scripts/ingest_cassandra.py --truncate
#   docker compose exec spark python /app/run_full_pipeline.py
#   docker compose exec spark python /app/data_visualization.py
#   docker compose exec spark streamlit run /app/dashboard_professional.py --server.address=0.0.0.0 --server.port=8501
#
# Or: scripts\docker_full.bat (Windows) / scripts/docker_full.sh (Git Bash)

services:
  cassandra:
    image: cassandra:4.1
    container_name: yelp-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=YelpCluster
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  spark:
    build:
      context: .
      dockerfile: spark-env/Dockerfile
    container_name: yelp-spark
    ports:
      - "8888:8888"
      - "8501:8501"
    working_dir: /app
    environment:
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=yelp
    volumes:
      - .:/app
    depends_on:
      cassandra:
        condition: service_healthy
